defaultNamespace: uyuni-server

labels:
  mlm-lab-bundle: uyuni-server

dependsOn:
  - selector:
      matchLabels:
        mlm-lab-bundle: uyuni-bootstrap
  - selector:
      matchLabels:
        mlm-lab-bundle: local-path-provisioner

helm:
  chart: "oci://registry.suse.com/suse/multi-linux-manager/5.2/server-helm"
  version: 5.2.0-beta2
  releaseName: smlm-server
  values:

    global:
      fqdn: ${ get .ClusterLabels "uyuni-fqdn" }

    ingress:
      type: traefik
      class: traefik

    server:
      superPrivileged: true

    tftp:
      enable: false

    repository: registry.suse.com/suse/multi-linux-manager/5.2/x86_64
    registrySecret: the-scc-secret

diff:
  comparePatches:
  - apiVersion: apps/v1
    kind: Deployment
    name: uyuni
    namespace: uyuni-server
    operations:
      # This ignores the entire volumes list during comparison
      - {"op": "remove", "path": "/spec/template/spec/volumes"}

kustomize:
  dir: ./kustomize
